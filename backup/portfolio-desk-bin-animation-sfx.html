<style>
:root{--bg:#f1f2f5;--ink:#23223a;--mute:#6b6a80;--violet:#7b3fe4;--teal:#2bb7a3;--gold:#d8a93f;--green:#2f7d62;--paper:#fffdf4;--paper2:#fbfaf5;--surface:#ffffff;--surface2:#f3f1f8;--line:#e5e1ed;--deskGlow:radial-gradient(ellipse at 50% 20%,#f8f9fb,var(--bg) 70%);

body.dark .skill-preview-item img[src*='nextdotjs'],body.dark .skill-detail-top img[src*='nextdotjs'],body.dark .skl img[src*='nextdotjs'],body.dark .skill-preview-item img[src*='github'],body.dark .skill-detail-top img[src*='github'],body.dark .skl img[src*='github'],body.dark .skill-preview-item img[src*='express'],body.dark .skill-detail-top img[src*='express'],body.dark .skl img[src*='express']{filter:invert(1)}
body{overflow-x:hidden;min-height:100vh}
#wrap{position:relative;width:100%;overflow:hidden;background:var(--deskGlow);transition:none}
#stage{position:absolute;left:0;top:0;width:1400px;height:1560px;transform-origin:0 0;--lx:0;--ly:0}
.obj{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;
 transition:transform .35s cubic-bezier(.3,1.6,.5,1),translate .25s ease,opacity .3s}
.obj:hover{translate:var(--pk,0 -3px)}
.obj.drag{cursor:grabbing;transition:none;translate:none}
.obj.fly{transition:left .85s cubic-bezier(.3,.8,.2,1),top .85s cubic-bezier(.3,.8,.2,1),transform .85s cubic-bezier(.3,.8,.2,1),opacity .3s}
.obj:focus-visible{outline:3px solid var(--violet);outline-offset:6px}
.obj.hide{visibility:hidden}.obj.dim{opacity:.18}
.obj.hit:after{content:"";position:absolute;inset:-7px;border:2px solid var(--violet);border-radius:10px;opacity:.75;pointer-events:none}
.obj.off{opacity:0;pointer-events:none}
/* depth: higher level = bigger, softer shadow */
.lv0{--a:1px;--b:3px;--bl:5px}.lv1{--a:1.5px;--b:5px;--bl:8px}.lv2{--a:2px;--b:8px;--bl:12px}.lv3{--a:3px;--b:10px;--bl:14px}.lv4{--a:2px;--b:6px;--bl:8px}
.face{width:100%;height:100%;position:relative;
 filter:drop-shadow(0 var(--a) 1px rgba(35,34,58,.16)) drop-shadow(0 var(--b) var(--bl) rgba(35,34,58,.10));transition:none}
.obj:hover .face{--b:8px;--bl:11px}
.obj.drag .face{--a:6px;--b:30px;--bl:28px}
.tip{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:4px 9px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:3}
.obj:hover .tip,.obj:focus-visible .tip{opacity:1}.obj.drag .tip{opacity:0}
.cut{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 5px 4px rgba(35,34,58,.2))}
.cut svg{width:100%;height:100%;overflow:visible}
.ln{height:6px;border-radius:3px;background:#e4e5ec;margin:7px 0}.ln.s{width:60%}.ln.m{width:82%}.ln.h{height:12px;width:55%;background:var(--ink);margin-bottom:12px}.ln.v{background:#d9c8fa}

/* paper: texture, folded corner, torn edge */
.pp{position:relative}
.pp:after{content:none}
.fold{clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%)}
.fold:before{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;background:linear-gradient(135deg,transparent 48%,#cfd0da 50%,#f4f4f8);box-shadow:-3px -3px 5px rgba(0,0,0,.14);border-top-left-radius:5px;z-index:2}
.torn{clip-path:polygon(0 0,100% 0,100% 93%,96% 97%,91% 93%,86% 98%,80% 94%,74% 97%,68% 93%,62% 98%,55% 94%,48% 97%,42% 93%,35% 98%,28% 94%,21% 97%,14% 93%,7% 98%,0 94%)}
.tape{position:absolute;top:-10px;left:50%;width:70px;height:22px;margin-left:-35px;background:rgba(232,169,58,.55);transform:rotate(-3deg);z-index:3}
.clip{position:absolute;top:-16px;left:34px;width:16px;height:48px;border:3px solid #aab0bd;border-radius:9px;z-index:3}
.bclip{position:absolute;top:-8px;left:42%;width:46px;height:24px;background:#2b2b3f;border-radius:3px 3px 0 0;z-index:3}
.bclip:before{content:"";position:absolute;left:-6px;right:-6px;top:-14px;height:20px;border:3px solid #9aa0b0;border-bottom:0;border-radius:14px 14px 0 0}
.hl{position:absolute;height:12px;background:rgba(255,222,46,.55);border-radius:3px;mix-blend-mode:multiply}
.hw{position:absolute;font:700 20px var(--hand);color:#3b4a9e;transform:rotate(-4deg);white-space:nowrap}
.stain{position:absolute;width:64px;height:64px;border-radius:50%;border:5px solid rgba(139,94,52,.26);box-shadow:inset 0 0 8px rgba(139,94,52,.18);filter:blur(.7px);pointer-events:none;z-index:1}

/* desk dustbin */
.dustbin{height:100%;position:relative;filter:drop-shadow(0 6px 10px rgba(35,34,58,.18));cursor:grab}
.dustbin .lid{position:absolute;left:7%;top:3%;width:86%;height:13%;background:linear-gradient(#70727a,#4b4d55);border-radius:4px 4px 2px 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.dustbin .handle{position:absolute;left:39%;top:0;width:22%;height:8%;border:3px solid #4a4b52;border-bottom:0;border-radius:7px 7px 0 0}
.dustbin .body{position:absolute;left:13%;right:13%;top:13%;bottom:5%;background:linear-gradient(90deg,#4d4f57,#777a82 48%,#4a4c54);clip-path:polygon(3% 0,97% 0,88% 100%,12% 100%);border-radius:3px;box-shadow:inset 8px 0 10px rgba(0,0,0,.14),inset -8px 0 10px rgba(255,255,255,.08)}
.dustbin .slot{position:absolute;top:22%;bottom:12%;width:4px;background:rgba(35,36,41,.36);border-radius:3px}
.dustbin .slot.s1{left:31%}.dustbin .slot.s2{left:49%}.dustbin .slot.s3{left:67%}
.dustbin .dust{position:absolute;border-radius:50%;background:#c8bda8;box-shadow:0 1px 2px rgba(0,0,0,.16);z-index:3}
.dustbin .d1{width:9px;height:7px;left:25%;top:27%;transform:rotate(18deg)}
.dustbin .d2{width:7px;height:10px;left:62%;top:36%;transform:rotate(-22deg);background:#9f9a8e}
.dustbin .d3{width:12px;height:5px;left:45%;top:53%;transform:rotate(8deg);background:#d2c7b0}
.dustbin .d4{width:6px;height:6px;left:73%;top:61%;background:#a8a193}
.dustbin .label{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font:700 11px var(--hand);color:var(--mute);white-space:nowrap;opacity:.72}
.dustbin .count{position:absolute;right:2%;top:8%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e45b73;color:#fff;display:grid;place-items:center;font:800 10px var(--font);z-index:4;box-shadow:0 2px 5px rgba(35,34,58,.2)}
.obj.bin-target .dustbin .body{filter:brightness(1.15);transform:scale(1.035)}
.obj.bin-target .dustbin .label{opacity:1;color:#e45b73}
body.dark .dustbin{filter:drop-shadow(0 9px 16px rgba(0,0,0,.5))}
body.dark .dustbin .body{background:linear-gradient(90deg,#36383e,#555861 48%,#34363c)}

.bin-panel{width:min(860px,90vw);max-height:78vh;background:var(--paper);border:1px solid #d7d0c0;border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}

.bin-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(80,75,70,.18)}

.bin-head p{margin:3px 0 0;color:var(--mute);font:600 12px var(--font)}
.bin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:16px;overflow:auto;max-height:62vh}
.bin-item{position:relative;min-height:130px;background:#f8f4e8;border:1px solid #d9d2c3;border-radius:3px;padding:8px;cursor:grab;box-shadow:0 4px 9px rgba(35,34,58,.1)}

.bin-item .thumb{height:78px;display:grid;place-items:center;overflow:hidden;background:#ebe5d6;border:1px solid #d5cebd}

.bin-item .thumb>*{max-width:100%;max-height:100%}
.bin-item .bn{display:block;margin-top:7px;font:800 13px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin-item .bc{display:block;margin-top:2px;font:600 10px var(--font);color:var(--mute)}
.bin-item .restore{margin-top:7px;border:1px solid #c9c0af;background:#fffdf7;padding:5px 8px;font:700 10px var(--font);cursor:pointer}

.bin-empty{padding:45px 20px;text-align:center;color:var(--mute);font:700 14px var(--hand)}
/* desk lamp */
.lamp-shell{position:relative;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(35,34,58,.18));transition:filter .45s ease,transform .25s ease}.lamp-glow{position:absolute;left:2%;top:4%;width:96%;height:86%;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,rgba(255,221,120,.72) 0%,rgba(255,221,120,.28) 32%,rgba(255,221,120,0) 72%);filter:blur(9px);opacity:1;transition:opacity .5s ease,transform .6s ease}.lamp-shell svg{position:relative;width:100%;height:100%;overflow:visible}.lamp-shell .shade{transition:fill .45s ease,filter .45s ease}.lamp-shell .bulb{transition:fill .45s ease,filter .45s ease,opacity .45s ease}.lamp-label{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font:700 11px var(--hand);color:var(--mute);white-space:nowrap;opacity:.65;transition:opacity .25s ease,color .35s ease}.obj.lamp-object{cursor:grab}.obj.lamp-object:hover .lamp-label{opacity:1}.lamp-shell.is-on .lamp-glow,.lamp-shell.is-on .bulb{animation:none}.lamp-shell.is-off .lamp-glow{opacity:0;transform:scale(.72)}.lamp-shell.is-off .shade{fill:#696a74;filter:brightness(.72)}.lamp-shell.is-off .bulb{fill:#50515a;filter:none;opacity:.55}.lamp-shell.is-off .lamp-label{color:#777985}.lamp-shell.switch-on{animation:lampSwitchOn .6s cubic-bezier(.2,.8,.2,1)}.lamp-shell.switch-off{animation:lampSwitchOff .45s cubic-bezier(.4,0,.7,1)}
@keyframes lampGlow{0%,100%{opacity:.78;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
@keyframes lampBulb{0%,100%{filter:drop-shadow(0 0 7px rgba(255,221,120,.72))}50%{filter:drop-shadow(0 0 15px rgba(255,221,120,1))}}
@keyframes lampSwitchOn{0%{transform:scale(.96) rotate(-1deg);filter:brightness(.7)}45%{transform:scale(1.035) rotate(.5deg);filter:brightness(1.2)}100%{transform:scale(1) rotate(0);filter:none}}
@keyframes lampSwitchOff{0%{transform:scale(1.02)}100%{transform:scale(.98)}}

.phone:before{content:"";position:absolute;left:2px;top:18%;bottom:18%;width:2px;background:linear-gradient(#6d7077,#24262c);border-radius:2px;opacity:.75}

.tl{position:relative;margin:14px 0 0 12px;padding-left:20px;border-left:3px solid #8a6a3d}.tl div{position:relative;margin-bottom:11px;font-size:12px;color:#5b4a2a;line-height:1.25}.tl div:before{content:"";position:absolute;left:-28px;top:2px;width:11px;height:11px;border-radius:50%;background:#d24a4a;border:2px solid #eadfc6}.tl b{display:block;font-size:13px;color:var(--ink)}

.folder:before{content:"";position:absolute;left:0;top:-14px;width:44%;height:16px;background:#e8c98b;border-radius:8px 8px 0 0}

.letter{height:100%;background:#fffdf4;padding:18px;position:relative;border-radius:3px}.letter q{display:block;padding-top:22px;font:italic 600 14px/1.35 var(--serif);color:#4a4250;quotes:none}.letter span{display:block;margin-top:10px;font-size:11px;color:var(--mute)}
.letter:before{content:"“";position:absolute;top:-6px;left:10px;font:800 70px var(--serif);color:#d9c8fa}

/* global polish + physical lamp spotlight */
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,a{transition:background-color .22s ease,border-color .22s ease,color .22s ease,box-shadow .22s ease,opacity .22s ease,transform .22s ease}
#stage:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 330px 250px at var(--lamp-x,975px) var(--lamp-y,835px),rgba(255,221,120,.13),rgba(255,221,120,0) 72%);opacity:0;transition:opacity .7s ease,background-position .7s ease}
body:not(.dark) #stage:before{opacity:.35}
body.dark #stage:before{opacity:.95;background:radial-gradient(ellipse 390px 310px at var(--lamp-x,975px) var(--lamp-y,835px),rgba(255,211,104,.2),rgba(255,196,72,.055) 32%,rgba(0,0,0,0) 74%)}
body.dark{background:#101116}
body.dark #stage{background:radial-gradient(ellipse 900px 600px at 50% 22%,rgba(255,255,255,.025),transparent 70%)}
body.dark .paper,body.dark .sheet,body.dark .skcard{box-shadow:0 8px 24px rgba(0,0,0,.32)}
body.dark .skl{background:#272822;border-color:#45463e;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.3)}
body.dark .skl:after{background:linear-gradient(135deg,transparent 48%,#4a483c 50%,#303028 52%)}
body.dark .skcard{border-color:#45463e}
body.dark .skcard .skill-lines,body.dark .skcard .skill-more{color:#ddd8ca}
body.dark .skill-detail{box-shadow:0 4px 12px rgba(0,0,0,.25)}
body.dark .skill-sheet{box-shadow:0 15px 50px rgba(0,0,0,.35)}
body.dark #veil.on{background:rgba(0,0,0,.68);backdrop-filter:blur(8px) saturate(.75)}
body.dark #panel{box-shadow:0 30px 100px rgba(0,0,0,.62);border:1px solid #34353c}
body.dark .vh button,body.dark .btn{border:1px solid #45464f}
body.dark .dtool{background:#1c1d22}

/* ---------- refined night desk ---------- */
:root{
  --night-bg:#090b10;
  --night-desk:#11141a;
  --night-desk-2:#181b22;
  --night-paper:#d8d0bd;
  --night-paper-2:#c9c1af;
  --night-ink:#252332;
  --night-mute:#817e8b;
  --night-edge:#393b43;
  --night-warm:#f6c968;
}
body, #wrap, #stage, .obj, .face, .paper, .sheet, .skcard, .skl, .skill-detail,
.tb, .drawer, #panel, .vh, .vb, .frame, .dview, .dtool, input, button{
  transition-property:background-color,background,background-image,color,border-color,box-shadow,filter,opacity;
  transition-duration:.5s;
  transition-timing-function:cubic-bezier(.22,.61,.36,1);
}

body.dark{
  --bg:var(--night-bg);
  --ink:#f0eadc;
  --mute:#aaa5b0;
  --paper:var(--night-paper);
  --paper2:var(--night-paper-2);
  --surface:#171a21;
  --surface2:#20242d;
  --line:#454852;
  --deskGlow:radial-gradient(ellipse 900px 650px at 50% 30%,#20242c 0%,#12151b 55%,#090b10 100%);
  background:var(--night-bg);
  color:var(--ink);
}
body.dark #wrap{
  background:
    radial-gradient(ellipse 520px 390px at var(--lamp-x,975px) var(--lamp-y,835px),rgba(255,201,101,.13),transparent 68%),
    radial-gradient(ellipse 900px 650px at 50% 25%,#20242b 0%,#11141a 58%,#090b10 100%);
}
body.dark #stage{
  background:
    radial-gradient(ellipse 430px 330px at var(--lamp-x,975px) var(--lamp-y,835px),rgba(255,213,126,.11),transparent 70%),
    radial-gradient(ellipse 850px 650px at 50% 20%,rgba(255,255,255,.028),transparent 72%);
}
body.dark #stage:before{
  opacity:1;
  mix-blend-mode:screen;
  background:
    radial-gradient(ellipse 330px 255px at var(--lamp-x,975px) var(--lamp-y,835px),rgba(255,224,145,.24) 0%,rgba(255,203,96,.12) 28%,rgba(255,190,70,.035) 50%,transparent 74%);
  filter:blur(1px);
}
body.dark .face{
  filter:
    drop-shadow(calc(var(--lx)*-1.5px) var(--a) 1px rgba(0,0,0,.72))
    drop-shadow(calc(var(--lx)*-3px) var(--b) var(--bl) rgba(0,0,0,.48));
}
body.dark .obj:hover .face{
  filter:
    drop-shadow(calc(var(--lx)*-1.5px) var(--a) 1px rgba(0,0,0,.7))
    drop-shadow(calc(var(--lx)*-3px) 14px 20px rgba(0,0,0,.5));
}

/* Papers remain paper — just lit like objects on a night desk. */
body.dark .paper,
body.dark .sheet,

  list.forEach((it,i)=>{

<script id="mug-spill">
/* Shake the coffee mug hard while dragging it: coffee splashes onto the desk and onto nearby items.

(function(){

 let tt;const say=m=>{toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),3000)};

  const d=document.createElement('i');d.className='spill';
  const r=()=>Math.round(rnd(38,62));
  d.style.width=size+'px';d.style.height=Math.round(size*rnd(.75,1))+'px';
  d.style.borderRadius=`${r()}% ${r()}% ${r()}% ${r()}% / ${r()}% ${r()}% ${r()}% ${r()}%`;
  d.style.transform=`rotate(${Math.round(rnd(0,180))}deg)`;

  busy=true;

  const nd=Math.round(rnd(3,5));
  for(let i=0;i<nd;i++){const a=rnd(0,Math.PI*2),r=rnd(55,190);
   targets.push({x:m.x+Math.cos(a)*r,y:m.y+Math.sin(a)*r*.8,size:rnd(34,70),item:null})}

  items.forEach(o=>{
   if(o===mug||o.isDustbin||o.themeLamp||o.inBin||o.el.style.display==='none')return;
   const c=ctr(o);if(Math.hypot(c.x-m.x,c.y-m.y)>200)return;

  targets.forEach((t,i)=>{
   const dur=reduce?0:Math.round(rnd(420,760)),delay=reduce?0:i*35;longest=Math.max(longest,dur+delay);
   const land=()=>{
    const b=blob(t.size,true,0);

   if(reduce){land();return}
   /* flying droplet: up and out, then down onto the target */
   const dp=document.createElement('i');dp.className='spill-drop';const sz=Math.round(rnd(5,10));
   dp.style.width=dp.style.height=sz+'px';stage.appendChild(dp);
   const dx=t.x-m.x,dy=t.y-m.y,peak=-rnd(50,110);
   dp.animate([
    {transform:`translate(${m.x}px,${m.y-20}px) scale(1)`,opacity:1},
    {transform:`translate(${m.x+dx*.55}px,${m.y+Math.min(dy,0)+peak}px) scale(1.1)`,opacity:1,offset:.5,easing:'ease-in'},
    {transform:`translate(${t.x}px,${t.y}px) scale(.6)`,opacity:.9}
   ],{duration:dur,delay,easing:'ease-out',fill:'both'}).onfinish=()=>{dp.remove();land()};
  });

  if(!reduce)mug.el.animate([{rotate:'0deg'},{rotate:'-9deg'},{rotate:'7deg'},{rotate:'-4deg'},{rotate:'0deg'}],{duration:420,easing:'ease-out'});
  say('Oops, coffee everywhere. Shake the mug again to wipe it up.');
  setTimeout(()=>{busy=false},longest+500);

  const keep=[];

   if(deskOnly&&b.parentNode!==stage){keep.push(b);return}

})();

<script id="desk-sfx">

                     (material-based: paper, card, ceramic, metal, wood, plastic, plush ...)

/* ---------- plumbing ---------- */
function asObj(it,fn){
 if(!ready())return;
 curPan=it&&it.w?clamp(((it.x+it.w/2)/1400-.5)*1.4,-.7,.7):0;
 try{fn()}catch(e){console.warn('desk sfx:',e)}
 curPan=0}
let sl=null;
function slideStart(it){
 slideStop();
 const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=MATS[matOf(it)].sl*(.9+H(it.id)%100/500);f.Q.value=.8;
 const s=ctx.createBufferSource();s.buffer=nbuf;s.loop=true;
 const g=ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);route(g);s.start(ctx.currentTime,Math.random());
 sl={s,g,to:0}}
function slideMove(d){
 if(!sl)return;
 sl.g.gain.setTargetAtTime(Math.min(.06,d*.0022),ctx.currentTime,.025);
 clearTimeout(sl.to);const g=sl.g;sl.to=setTimeout(()=>{try{g.gain.setTargetAtTime(0,ctx.currentTime,.06)}catch(e){}},70)}
function slideStop(){
 if(!sl)return;const {s,g,to}=sl;sl=null;clearTimeout(to);
 try{g.gain.setTargetAtTime(0,ctx.currentTime,.03);s.stop(ctx.currentTime+.2)}catch(e){}}

const binItem=items.find(i=>i.isDustbin),lampItem=items.find(i=>i.themeLamp),laptopItem=items.find(i=>i.id==='laptop');

/* open */
const _oi=openItem;openItem=function(it){if(it&&!cur&&!busy)asObj(it,()=>openSfx(it));return _oi.apply(this,arguments)};
const _op=openPlain;openPlain=function(it){if(it)asObj(it,()=>openSfx(it));return _op.apply(this,arguments)};

/* dustbin */
const _pb=putInBin;putInBin=function(it){
 const sweeping=!!(it&&it.el&&it.el.style.pointerEvents==='none');
 const r=_pb.apply(this,arguments);
 if(it&&!it.isDustbin&&it.inBin){
  if(sweeping){if(gate('sweep',45))asObj(binItem,()=>{vs=1;tone({f:300+(sweepN++%12)*45,d:.05,type:'triangle',v:.05})})}
  else if(gate('binDrop',80))asObj(binItem,()=>binDrop(it))}
 return r};
const _rb=removeFromBin;removeFromBin=function(it){
 const was=!!(it&&it.inBin&&it._swept);
 const r=_rb.apply(this,arguments);
 if(was&&gate('unsweep',45))asObj(binItem,()=>{vs=1;tone({f:rnd(500,900),f2:rnd(1000,1600),d:.06,v:.06})});

const _rf=restoreFromBin;restoreFromBin=function(it){

/* reset / organise / mess */

/* per-object: hover note, lift, friction slide, drop */
items.forEach(it=>{
 const el=it.el;if(!el)return;
 let lx=0,ly=0,drag=false;
 el.addEventListener('pointerenter',e=>{if(e.pointerType==='touch'||dragging||cur||busy)return;if(gate('hover',60))asObj(it,()=>hoverSfx(it))});
 el.addEventListener('pointerdown',e=>{lx=e.clientX;ly=e.clientY;drag=false});
 el.addEventListener('pointermove',e=>{
  if(!el.classList.contains('drag'))return;
  if(!drag){drag=true;lx=e.clientX;ly=e.clientY;asObj(it,()=>{vs=1;lift(it);slideStart(it)})}
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;slideMove(Math.hypot(dx,dy))});
 const end=cancel=>{if(!drag)return;drag=false;slideStop();if(cancel||it.inBin)return;asObj(it,()=>{vs=1;drop(it)})};
 el.addEventListener('pointerup',()=>end(false));
 el.addEventListener('pointercancel',()=>end(true));
});

/* things the other scripts do: toast messages, coffee landing, laptop notification, bin target */
const toast=document.getElementById('binToast');
if(toast)new MutationObserver(()=>{
 const m=toast.textContent||'';
 if(m.indexOf('Desk swept')===0){sweepN=0;asObj(binItem,()=>{vs=1;SCENE.sweep()})}
 else if(m.indexOf('Everything is back')===0)asObj(binItem,()=>{vs=1;SCENE.restore()});
 else if(m.indexOf('Oops')===0)asObj(items.find(i=>i.id==='mug'),()=>{vs=1;SCENE.coffee()});
 else if(m.indexOf('All wiped')===0)asObj(items.find(i=>i.id==='mug'),()=>{vs=1;SCENE.wipe()});
}).observe(toast,{childList:true,characterData:true,subtree:true});
if(typeof stage!=='undefined')new MutationObserver(list=>{
 for(const r of list)for(const n of r.addedNodes){
  if(n.nodeType===1&&n.classList&&n.classList.contains('spill')&&gate('splat',35))
   asObj(null,()=>{vs=1;tone({f:rnd(260,520),f2:rnd(120,220),d:.08,v:.07,a:.002});noise({d:.05,type:'lowpass',f:900,v:.05})})}
}).observe(stage,{childList:true,subtree:true});

 for(const r of list)for(const n of r.addedNodes)if(n.classList&&n.classList.contains('dot'))asObj(laptopItem,()=>{vs=1;SCENE.notify()})
}).observe(laptopItem.el,{childList:true});
if(binItem&&binItem.el){let was=false;new MutationObserver(()=>{

}).observe(binItem.el,{attributes:true,attributeFilter:['class']})}
